<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="日历记录" />
  <meta name="theme-color" content="#4f46e5" />
  <title>日历记录</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root {
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }
    .month-nav {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .month-nav button {
      width: 36px; height: 36px; border: none;
      background: var(--primary-soft); color: var(--primary);
      border-radius: 10px; font-size: 20px; line-height: 1; cursor: pointer;
      display: grid; place-items: center; font-family: inherit;
      transition: background 0.15s;
    }
    .month-nav button:active { background: #dde3ff; }
    .month-label { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
    .month-total-row { text-align: center; margin-bottom: 14px; }
    .month-total {
      display: inline-block; font-size: 13px; font-weight: 600;
      color: var(--primary); background: var(--primary-soft);
      padding: 5px 14px; border-radius: 999px;
    }
    .month-total strong { font-weight: 800; margin-left: 2px; font-variant-numeric: tabular-nums; }
    .weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr);
      text-align: center; font-size: 12px; color: var(--muted);
      margin-bottom: 6px; user-select: none;
    }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day {
      min-height: 54px; padding: 6px 2px 4px; border: none;
      background: transparent; border-radius: 12px; font-family: inherit;
      color: var(--text); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; transition: background 0.15s; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .day:not(.blank):hover { background: #f3f4f6; }
    .day.blank { pointer-events: none; visibility: hidden; }
    .day-num { font-size: 14px; line-height: 1; }
    .day-value {
      font-size: 11px; font-weight: 700; line-height: 12px; height: 12px;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--primary); font-variant-numeric: tabular-nums;
    }
    .day.today:not(.selected) { background: var(--primary-soft); }
    .day.today:not(.selected) .day-num { color: var(--primary); font-weight: 700; }
    .day.selected { background: var(--primary); }
    .day.selected .day-num, .day.selected .day-value { color: #ffffff; }
    .selected-info {
      margin-top: 20px; padding: 14px 16px; background: var(--primary-soft);
      border-radius: 14px; text-align: center;
    }
    .selected-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .selected-date { font-size: 17px; font-weight: 700; color: var(--primary); }
    .input-area { margin-top: 16px; }
    #dataInput {
      width: 100%; padding: 14px 16px; border-radius: 14px;
      border: 1.5px solid var(--border); font-size: 16px; font-family: inherit;
      outline: none; background: #fafafa; color: var(--text);
      transition: border-color 0.2s, background 0.2s;
      font-variant-numeric: tabular-nums;
    }
    #dataInput:focus { border-color: var(--primary); background: #ffffff; }
    #dataInput::placeholder { color: #9ca3af; font-variant-numeric: normal; }
    #confirmBtn {
      width: 100%; margin-top: 12px; padding: 14px; border: none;
      border-radius: 14px; background: var(--primary); color: #ffffff;
      font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    #confirmBtn:active { transform: scale(0.99); background: #4338ca; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(17, 24, 39, 0.5);
      display: none; align-items: center; justify-content: center;
      padding: 24px; z-index: 100;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #ffffff; border-radius: 20px; padding: 24px 20px 20px;
      width: 100%; max-width: 320px; text-align: center;
      animation: pop 0.18s ease-out;
    }
    @keyframes pop {
      from { transform: scale(0.95); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .modal-text { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions button {
      padding: 12px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    #modalCancel { background: #f3f4f6; color: #374151; }
    #modalCancel:active { background: #e5e7eb; }
    #modalConfirm { background: var(--primary); color: #ffffff; }
    #modalConfirm:active { background: #4338ca; }
    .toast {
      position: fixed; left: 50%; bottom: 40px;
      transform: translate(-50%, 20px);
      background: rgba(17, 24, 39, 0.9); color: #ffffff;
      padding: 10px 20px; border-radius: 999px; font-size: 14px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 200; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- 登录界面 ---------- */
    #loginScreen {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 300; display: none;
      flex-direction: column; justify-content: center; align-items: center;
      padding: 24px;
    }
    #loginScreen h2 { margin: 0 0 8px; font-size: 22px; }
    #loginScreen p.sub {
      color: var(--muted); font-size: 14px; margin: 0 0 24px; text-align: center;
    }
    .form {
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column;
    }
    .form input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--border);
      border-radius: 14px; font-size: 16px; font-family: inherit;
      outline: none; background: #ffffff;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .form input:focus { border-color: var(--primary); }
    .form button {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .form button:disabled { opacity: 0.6; cursor: default; }
    #loginBtn { background: var(--primary); color: #ffffff; margin-top: 4px; }
    #loginBtn:active { background: #4338ca; }
    #signUpBtn {
      background: transparent; color: var(--primary);
      font-size: 14px; font-weight: 600;
      margin-top: 10px; padding: 8px;
    }
    #signUpBtn:active { background: var(--primary-soft); }
    #loginMsg {
      margin-top: 14px; font-size: 14px; color: var(--muted);
      text-align: center; max-width: 320px; line-height: 1.5;
      min-height: 20px;
    }
    #loginMsg.error { color: var(--danger); }
    #loginMsg.success { color: #059669; }

    #loadingScreen {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 400; display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: var(--muted);
    }
  </style>
</head>
<body>

  <div id="loadingScreen">加载中…</div>

  <!-- 登录界面 -->
  <div id="loginScreen">
    <h2>日历记录</h2>
    <p class="sub">使用邮箱和密码登录</p>

    <div class="form">
      <input
        id="emailInput"
        type="email"
        placeholder="your@email.com"
        autocomplete="email"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        name="email"
      />
      <input
        id="passwordInput"
        type="password"
        placeholder="密码（至少 6 位）"
        autocomplete="current-password"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        name="password"
      />
      <button id="loginBtn">登录</button>
      <button id="signUpBtn">注册新账号</button>
    </div>

    <p id="loginMsg"></p>
  </div>

  <!-- 主应用 -->
  <div class="app">
    <header class="month-nav">
      <button id="prevMonth" aria-label="上个月">‹</button>
      <div class="month-label" id="monthLabel">-</div>
      <button id="nextMonth" aria-label="下个月">›</button>
    </header>

    <div class="month-total-row">
      <span class="month-total">本月合计 <strong id="monthTotal">0</strong></span>
    </div>

    <div class="weekdays">
      <span>一</span><span>二</span><span>三</span>
      <span>四</span><span>五</span><span>六</span><span>日</span>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="selected-info">
      <div class="selected-label">当前日期</div>
      <div class="selected-date" id="selectedDate">-</div>
    </div>

    <div class="input-area">
      <input type="text" id="dataInput" inputmode="numeric" pattern="[0-9]*"
             maxlength="9" placeholder="输入数字…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button id="confirmBtn">确定</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-title" id="modalTitle">覆盖确认</div>
      <div class="modal-text" id="modalText">该日期已有数据，是否覆盖？</div>
      <div class="modal-actions">
        <button id="modalCancel">取消</button>
        <button id="modalConfirm">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script>

  <script>
    (function () {
      'use strict';

      /* =========================================================
       * 【填这里】你的 Supabase 信息
       * ========================================================= */
      const SUPABASE_URL = 'https://shybldupzoylnumbcxev.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_lFgzqTsMYodX3s0r6H_JNA_bs6jDV3K';

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          // 保持登录状态，不主动登出就一直有效
          persistSession: true,
          autoRefreshToken: true,
          storage: window.localStorage,
        },
      });

      const WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

      let currentUser = null;
      let allData = {};

      const today = new Date();
      const todayStr = formatDate(today.getFullYear(), today.getMonth(), today.getDate());

      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth();
      let selectedDate = todayStr;

      function pad2(n) { return String(n).padStart(2, '0'); }
      function formatDate(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
      function parseDate(str) {
        const parts = str.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }
      function formatDisplayDate(str) {
        const d = parseDate(str);
        return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' +
               d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
      }

      /* ---------- DOM ---------- */
      const loadingScreen  = document.getElementById('loadingScreen');
      const loginScreen    = document.getElementById('loginScreen');
      const emailInput     = document.getElementById('emailInput');
      const passwordInput  = document.getElementById('passwordInput');
      const loginBtn       = document.getElementById('loginBtn');
      const signUpBtn      = document.getElementById('signUpBtn');
      const loginMsg       = document.getElementById('loginMsg');

      const monthLabel     = document.getElementById('monthLabel');
      const monthTotalEl   = document.getElementById('monthTotal');
      const calendarGrid   = document.getElementById('calendarGrid');
      const selectedDateEl = document.getElementById('selectedDate');
      const dataInput      = document.getElementById('dataInput');
      const confirmBtn     = document.getElementById('confirmBtn');
      const modalBackdrop  = document.getElementById('modalBackdrop');
      const modalTitle     = document.getElementById('modalTitle');
      const modalText      = document.getElementById('modalText');
      const modalCancel    = document.getElementById('modalCancel');
      const modalConfirm   = document.getElementById('modalConfirm');
      const toastEl        = document.getElementById('toast');

      /* ---------- 渲染 ---------- */
      function renderMonthLabel() {
        monthLabel.textContent = viewYear + '年' + (viewMonth + 1) + '月';
      }
      function renderMonthTotal() {
        const days = new Date(viewYear, viewMonth + 1, 0).getDate();
        let sum = 0;
        for (let d = 1; d <= days; d++) {
          const v = allData[formatDate(viewYear, viewMonth, d)];
          if (typeof v === 'number') sum += v;
        }
        monthTotalEl.textContent = sum.toLocaleString();
      }
      function renderCalendar() {
        const firstDay    = new Date(viewYear, viewMonth, 1);
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const startOffset = (firstDay.getDay() + 6) % 7;
        const frag = document.createDocumentFragment();

        for (let i = 0; i < startOffset; i++) {
          const blank = document.createElement('div');
          blank.className = 'day blank';
          frag.appendChild(blank);
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = formatDate(viewYear, viewMonth, d);
          const value = allData[dateStr];
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'day';
          cell.dataset.date = dateStr;
          if (dateStr === todayStr)     cell.classList.add('today');
          if (dateStr === selectedDate) cell.classList.add('selected');
          if (value !== undefined)      cell.classList.add('has-data');

          const numEl = document.createElement('span');
          numEl.className = 'day-num';
          numEl.textContent = d;
          cell.appendChild(numEl);

          const valEl = document.createElement('span');
          valEl.className = 'day-value';
          valEl.textContent = value !== undefined ? String(value) : '';
          cell.appendChild(valEl);

          cell.addEventListener('click', function () { selectDate(dateStr); });
          frag.appendChild(cell);
        }
        calendarGrid.innerHTML = '';
        calendarGrid.appendChild(frag);
      }
      function renderSelectedInfo() {
        selectedDateEl.textContent = formatDisplayDate(selectedDate);
      }
      function renderInput() {
        const value = allData[selectedDate];
        dataInput.value = value === undefined ? '' : String(value);
      }
      function renderAll() {
        renderMonthLabel();
        renderMonthTotal();
        renderCalendar();
        renderSelectedInfo();
        renderInput();
      }

      /* ---------- 交互 ---------- */
      function selectDate(dateStr) {
        selectedDate = dateStr;
        renderSelectedInfo();
        renderInput();
        renderCalendar();
      }
      function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
        else if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
        renderMonthLabel();
        renderMonthTotal();
        renderCalendar();
      }
      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 1600);
      }
      function openModal(title, text, onConfirm) {
        modalTitle.textContent = title;
        modalText.textContent = text;
        modalBackdrop.classList.add('show');
        modalConfirm.onclick = function () { closeModal(); onConfirm(); };
      }
      function closeModal() {
        modalBackdrop.classList.remove('show');
        modalConfirm.onclick = null;
      }

      /* ---------- Supabase 数据读写 ---------- */
      async function loadDataFromSupabase() {
        if (!currentUser) return;
        const { data, error } = await supabase
          .from('entries')
          .select('date, value')
          .eq('user_id', currentUser.id);
        if (error) {
          console.error('加载数据失败:', error);
          showToast('加载数据失败');
          return;
        }
        allData = {};
        (data || []).forEach(function (row) { allData[row.date] = row.value; });
      }
      async function saveToSupabase(dateStr, value) {
        if (!currentUser) return false;
        if (value === null) {
          const { error } = await supabase
            .from('entries')
            .delete()
            .eq('user_id', currentUser.id)
            .eq('date', dateStr);
          return !error;
        }
        const { error } = await supabase
          .from('entries')
          .upsert(
            { user_id: currentUser.id, date: dateStr, value: value },
            { onConflict: 'user_id,date' }
          );
        return !error;
      }

      async function commit(value) {
        const ok = await saveToSupabase(selectedDate, value);
        if (!ok) { showToast('保存失败，请重试'); return; }
        if (value === null) delete allData[selectedDate];
        else allData[selectedDate] = value;
        renderMonthTotal();
        renderCalendar();
        showToast(value === null ? '已清空该日数据' : '已保存');
      }

      function handleConfirm() {
        const raw = dataInput.value.trim();
        const existing = allData[selectedDate];
        if (raw === '') {
          if (existing === undefined) { showToast('该日没有数据'); return; }
          openModal('清空确认', '确定要清空该日的数据吗？', function () { commit(null); });
          return;
        }
        if (!/^\d+$/.test(raw)) { showToast('请输入数字'); return; }
        const value = parseInt(raw, 10);
        if (!Number.isFinite(value)) { showToast('数字无效'); return; }
        if (existing !== undefined && existing !== value) {
          openModal('覆盖确认',
            '该日期已有数据 ' + existing + '，是否覆盖为 ' + value + '？',
            function () { commit(value); });
          return;
        }
        commit(value);
      }

      /* =========================================================
       * 登录：邮箱 + 密码
       * ========================================================= */
      function formatError(err) {
        if (!err) return '未知错误（err 为空）';
        if (typeof err === 'string') return err;

        const lines = [];

        try {
          // 收集所有自身属性，包括非枚举的
          const keys = Object.getOwnPropertyNames(err);
          keys.forEach(function (k) {
            if (k === 'stack') return; // 堆栈太长，先跳过
            const v = err[k];
            if (v === undefined || v === null) return;

            let str;
            if (typeof v === 'object') {
              try { str = JSON.stringify(v); }
              catch (e) { str = String(v); }
            } else {
              str = String(v);
            }
            lines.push(k + ': ' + str);
          });
        } catch (e) {
          lines.push('（无法枚举错误属性：' + String(e) + '）');
        }

        if (lines.length === 0) {
          return String(err);
        }

        // 附加一下当前 URL，排查跨域问题时有用
        lines.push('URL: ' + location.href);

        return lines.join('\n');
      }
      function setMsg(text, type) {
        loginMsg.textContent = text || '';
        loginMsg.className = type || '';
      }

      function setLoading(on) {
        loginBtn.disabled = on;
        signUpBtn.disabled = on;
      }

      function validateInputs() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email) { setMsg('请输入邮箱', 'error'); return null; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setMsg('邮箱格式不正确', 'error'); return null;
        }
        if (!password) { setMsg('请输入密码', 'error'); return null; }
        if (password.length < 6) {
          setMsg('密码至少需要 6 位', 'error'); return null;
        }
        return { email: email, password: password };
      }

      async function handleLogin() {
        const inputs = validateInputs();
        if (!inputs) return;

        setLoading(true);
        setMsg('登录中…');

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: inputs.email,
            password: inputs.password,
          });

          if (error) {
            setMsg('登录失败：' + error.message, 'error');
            return;
          }
          if (data && data.session && data.user) {
            await enterApp(data.user);
          } else {
            setMsg('登录失败，请重试', 'error');
          }
        } catch (e) {
          setMsg('登录失败：' + (e.message || e), 'error');
        } finally {
          setLoading(false);
        }
      }

      async function handleSignUp() {
        const inputs = validateInputs();
        if (!inputs) return;

        setLoading(true);
        setMsg('注册中…');

        try {
          const { data, error } = await supabase.auth.signUp({
            email: inputs.email,
            password: inputs.password,
          });

          if (error) {
            setMsg('注册失败：' + error.message, 'error');
            return;
          }

          if (data && data.session && data.user) {
            // 项目未开启邮箱确认 → 直接进入
            await enterApp(data.user);
            return;
          }

          if (data && data.user) {
            // 项目开启了邮箱确认 → 需要用户去邮箱点确认
            setMsg('注册成功！请到邮箱点击确认链接，然后回到这里登录。', 'success');
            return;
          }

          setMsg('注册失败，请重试', 'error');
        } catch (e) {
          setMsg('注册失败：' + (e.message || e), 'error');
        } finally {
          setLoading(false);
        }
      }

      async function enterApp(user) {
        currentUser = user;
        passwordInput.value = '';   // 登录后清空密码框
        loginScreen.style.display = 'none';
        loadingScreen.style.display = 'flex';
        await loadDataFromSupabase();
        loadingScreen.style.display = 'none';
        renderAll();
      }

      function showLogin() {
        currentUser = null;
        allData = {};
        loadingScreen.style.display = 'none';
        loginScreen.style.display = 'flex';
        setMsg('');
      }

      async function init() {
        // 页面加载时尝试恢复已保存的会话
        const { data: { session } } = await supabase.auth.getSession();
        if (session && session.user) {
          await enterApp(session.user);
        } else {
          showLogin();
        }
      }

      /* ---------- 事件绑定 ---------- */
      loginBtn.addEventListener('click', handleLogin);
      signUpBtn.addEventListener('click', handleSignUp);

      [emailInput, passwordInput].forEach(function (el) {
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleLogin();
          }
        });
      });

      supabase.auth.onAuthStateChange(function (event, session) {
        if (event === 'SIGNED_IN' && session && session.user) {
          if (!currentUser) enterApp(session.user);
        } else if (event === 'SIGNED_OUT') {
          showLogin();
        }
      });

      document.getElementById('prevMonth').addEventListener('click', function () { changeMonth(-1); });
      document.getElementById('nextMonth').addEventListener('click', function () { changeMonth(1); });
      confirmBtn.addEventListener('click', handleConfirm);
      dataInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); handleConfirm(); }
      });
      dataInput.addEventListener('input', function () {
        const cleaned = this.value.replace(/[^0-9]/g, '');
        if (cleaned !== this.value) {
          const pos = this.selectionStart;
          this.value = cleaned;
          const newPos = Math.max(0, pos - (this.value.length - cleaned.length));
          try { this.setSelectionRange(newPos, newPos); } catch (e) {}
        }
      });

      modalCancel.addEventListener('click', closeModal);
      modalBackdrop.addEventListener('click', function (e) {
        if (e.target === modalBackdrop) closeModal();
      });

      init();
    })();
  </script>
</body>
</html>
