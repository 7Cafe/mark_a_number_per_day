<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="日历记录" />
  <meta name="theme-color" content="#4f46e5" />
  <title>日历记录</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root {
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }

    /* ---------- 月份导航 ---------- */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .month-nav button {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 10px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-family: inherit;
      transition: background 0.15s;
    }

    .month-nav button:active {
      background: #dde3ff;
    }

    .month-label {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ---------- 本月合计 ---------- */
    .month-total-row {
      text-align: center;
      margin-bottom: 14px;
    }

    .month-total {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 5px 14px;
      border-radius: 999px;
    }

    .month-total strong {
      font-weight: 800;
      margin-left: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 星期行 ---------- */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      user-select: none;
    }

    /* ---------- 日历网格 ---------- */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day {
      min-height: 54px;
      padding: 6px 2px 4px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: background 0.15s;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .day:not(.blank):hover {
      background: #f3f4f6;
    }

    .day.blank {
      pointer-events: none;
      visibility: hidden;
    }

    .day-num {
      font-size: 14px;
      line-height: 1;
    }

    .day-value {
      font-size: 11px;
      font-weight: 700;
      line-height: 12px;
      height: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    /* 今天（未被选中时） */
    .day.today:not(.selected) {
      background: var(--primary-soft);
    }

    .day.today:not(.selected) .day-num {
      color: var(--primary);
      font-weight: 700;
    }

    /* 选中 */
    .day.selected {
      background: var(--primary);
    }

    .day.selected .day-num,
    .day.selected .day-value {
      color: #ffffff;
    }

    /* ---------- 当前日期 ---------- */
    .selected-info {
      margin-top: 20px;
      padding: 14px 16px;
      background: var(--primary-soft);
      border-radius: 14px;
      text-align: center;
    }

    .selected-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .selected-date {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
    }

    /* ---------- 输入区 ---------- */
    .input-area {
      margin-top: 16px;
    }

    #dataInput {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      font-size: 16px;
      font-family: inherit;
      outline: none;
      background: #fafafa;
      color: var(--text);
      transition: border-color 0.2s, background 0.2s;
      font-variant-numeric: tabular-nums;
    }

    #dataInput:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    #dataInput::placeholder {
      color: #9ca3af;
      font-variant-numeric: normal;
    }

    #confirmBtn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }

    #confirmBtn:active {
      transform: scale(0.99);
      background: #4338ca;
    }

    /* ---------- 弹窗 ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      animation: pop 0.18s ease-out;
    }

    @keyframes pop {
      from { transform: scale(0.95); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-actions button {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    #modalCancel {
      background: #f3f4f6;
      color: #374151;
    }

    #modalCancel:active {
      background: #e5e7eb;
    }

    #modalConfirm {
      background: var(--primary);
      color: #ffffff;
    }

    #modalConfirm:active {
      background: #4338ca;
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translate(-50%, 20px);
      background: rgba(17, 24, 39, 0.9);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="month-nav">
      <button id="prevMonth" aria-label="上个月">‹</button>
      <div class="month-label" id="monthLabel">-</div>
      <button id="nextMonth" aria-label="下个月">›</button>
    </header>

    <div class="month-total-row">
      <span class="month-total">本月合计 <strong id="monthTotal">0</strong></span>
    </div>

    <div class="weekdays">
      <span>一</span><span>二</span><span>三</span>
      <span>四</span><span>五</span><span>六</span><span>日</span>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="selected-info">
      <div class="selected-label">当前日期</div>
      <div class="selected-date" id="selectedDate">-</div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="dataInput"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="9"
        placeholder="输入数字…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button id="confirmBtn">确定</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-title" id="modalTitle">覆盖确认</div>
      <div class="modal-text" id="modalText">该日期已有数据，是否覆盖？</div>
      <div class="modal-actions">
        <button id="modalCancel">取消</button>
        <button id="modalConfirm">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'daily-notes-app-v1';
      const WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

      /* =========================================================
       * 存储层（以后换数据库，只改这两个函数）
       *
       * 数据结构：{ "2026-10-16": 42, "2026-10-17": 8 }
       * ========================================================= */
      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          // 兼容旧数据：把字符串数字转成 number
          const clean = {};
          Object.keys(parsed).forEach(function (k) {
            const v = parsed[k];
            const n = typeof v === 'number' ? v : parseInt(v, 10);
            if (Number.isFinite(n)) clean[k] = n;
          });
          return clean;
        } catch (e) {
          console.warn('读取数据失败', e);
          return {};
        }
      }

      function saveData(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          return true;
        } catch (e) {
          console.warn('保存数据失败', e);
          return false;
        }
      }

      /* =========================================================
       * 工具函数
       * ========================================================= */
      function pad2(n) {
        return String(n).padStart(2, '0');
      }

      // m 是 0-based
      function formatDate(y, m, d) {
        return y + '-' + pad2(m + 1) + '-' + pad2(d);
      }

      function parseDate(str) {
        const parts = str.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function formatDisplayDate(str) {
        const d = parseDate(str);
        return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' +
               d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
      }

      /* =========================================================
       * 状态
       * ========================================================= */
      const today = new Date();
      const todayStr = formatDate(today.getFullYear(), today.getMonth(), today.getDate());

      let allData = loadData();
      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth();
      let selectedDate = todayStr;

      /* =========================================================
       * DOM
       * ========================================================= */
      const monthLabel     = document.getElementById('monthLabel');
      const monthTotalEl   = document.getElementById('monthTotal');
      const calendarGrid   = document.getElementById('calendarGrid');
      const selectedDateEl = document.getElementById('selectedDate');
      const dataInput      = document.getElementById('dataInput');
      const confirmBtn     = document.getElementById('confirmBtn');
      const modalBackdrop  = document.getElementById('modalBackdrop');
      const modalTitle     = document.getElementById('modalTitle');
      const modalText      = document.getElementById('modalText');
      const modalCancel    = document.getElementById('modalCancel');
      const modalConfirm   = document.getElementById('modalConfirm');
      const toastEl        = document.getElementById('toast');

      /* =========================================================
       * 渲染
       * ========================================================= */
      function renderMonthLabel() {
        monthLabel.textContent = viewYear + '年' + (viewMonth + 1) + '月';
      }

      function renderMonthTotal() {
        const days = new Date(viewYear, viewMonth + 1, 0).getDate();
        let sum = 0;
        for (let d = 1; d <= days; d++) {
          const key = formatDate(viewYear, viewMonth, d);
          const v = allData[key];
          if (typeof v === 'number') sum += v;
        }
        monthTotalEl.textContent = sum.toLocaleString();
      }

      function renderCalendar() {
        const firstDay    = new Date(viewYear, viewMonth, 1);
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        // 周一为第一列：getDay() 里 0=周日，先 +6 再取模
        const startOffset = (firstDay.getDay() + 6) % 7;

        const frag = document.createDocumentFragment();

        // 月初空白格
        for (let i = 0; i < startOffset; i++) {
          const blank = document.createElement('div');
          blank.className = 'day blank';
          frag.appendChild(blank);
        }

        // 日期格
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = formatDate(viewYear, viewMonth, d);
          const value = allData[dateStr];

          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'day';
          cell.dataset.date = dateStr;

          if (dateStr === todayStr)     cell.classList.add('today');
          if (dateStr === selectedDate) cell.classList.add('selected');
          if (value !== undefined)      cell.classList.add('has-data');

          const numEl = document.createElement('span');
          numEl.className = 'day-num';
          numEl.textContent = d;
          cell.appendChild(numEl);

          const valEl = document.createElement('span');
          valEl.className = 'day-value';
          valEl.textContent = value !== undefined ? String(value) : '';
          cell.appendChild(valEl);

          cell.addEventListener('click', function () {
            selectDate(dateStr);
          });

          frag.appendChild(cell);
        }

        calendarGrid.innerHTML = '';
        calendarGrid.appendChild(frag);
      }

      function renderSelectedInfo() {
        selectedDateEl.textContent = formatDisplayDate(selectedDate);
      }

      function renderInput() {
        const value = allData[selectedDate];
        dataInput.value = value === undefined ? '' : String(value);
      }

      function renderAll() {
        renderMonthLabel();
        renderMonthTotal();
        renderCalendar();
        renderSelectedInfo();
        renderInput();
      }

      /* =========================================================
       * 交互
       * ========================================================= */
      function selectDate(dateStr) {
        selectedDate = dateStr;
        renderSelectedInfo();
        renderInput();
        renderCalendar();
      }

      function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear -= 1;
        } else if (viewMonth > 11) {
          viewMonth = 0;
          viewYear += 1;
        }
        renderMonthLabel();
        renderMonthTotal();
        renderCalendar();
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 1600);
      }

      function openModal(title, text, onConfirm) {
        modalTitle.textContent = title;
        modalText.textContent = text;
        modalBackdrop.classList.add('show');
        modalConfirm.onclick = function () {
          closeModal();
          onConfirm();
        };
      }

      function closeModal() {
        modalBackdrop.classList.remove('show');
        modalConfirm.onclick = null;
      }

      // 真正的写入动作，value 为 null 表示删除
      function commit(value) {
        if (value === null) {
          delete allData[selectedDate];
        } else {
          allData[selectedDate] = value;
        }
        saveData(allData);
        renderMonthTotal();
        renderCalendar();
        showToast(value === null ? '已清空该日数据' : '已保存');
      }

      function handleConfirm() {
        const raw = dataInput.value.trim();
        const existing = allData[selectedDate];

        // 空输入 → 清空该日
        if (raw === '') {
          if (existing === undefined) {
            showToast('该日没有数据');
            return;
          }
          openModal('清空确认', '确定要清空该日的数据吗？', function () {
            commit(null);
          });
          return;
        }

        // 数字校验
        if (!/^\d+$/.test(raw)) {
          showToast('请输入数字');
          return;
        }

        const value = parseInt(raw, 10);
        if (!Number.isFinite(value)) {
          showToast('数字无效');
          return;
        }

        // 已有数据且不同 → 询问覆盖
        if (existing !== undefined && existing !== value) {
          openModal(
            '覆盖确认',
            '该日期已有数据 ' + existing + '，是否覆盖为 ' + value + '？',
            function () { commit(value); }
          );
          return;
        }

        commit(value);
      }

      /* =========================================================
       * 事件绑定
       * ========================================================= */
      document.getElementById('prevMonth').addEventListener('click', function () {
        changeMonth(-1);
      });
      document.getElementById('nextMonth').addEventListener('click', function () {
        changeMonth(1);
      });

      confirmBtn.addEventListener('click', handleConfirm);

      dataInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleConfirm();
        }
      });

      // 只允许数字：实时过滤输入和粘贴
      dataInput.addEventListener('input', function () {
        const cleaned = this.value.replace(/[^0-9]/g, '');
        if (cleaned !== this.value) {
          const pos = this.selectionStart;
          this.value = cleaned;
          // 尽量保持光标位置
          const newPos = Math.max(0, pos - (this.value.length - cleaned.length));
          try { this.setSelectionRange(newPos, newPos); } catch (e) {}
        }
      });

      modalCancel.addEventListener('click', closeModal);
      modalBackdrop.addEventListener('click', function (e) {
        if (e.target === modalBackdrop) closeModal();
      });

      /* =========================================================
       * 初始化
       * ========================================================= */
      renderAll();
    })();
  </script>
</body>
</html>
